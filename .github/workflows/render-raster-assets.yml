name: Render 3D raster assets

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/asset-studio/**'

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tools/asset-studio/package-lock.json
      - name: Install Asset Studio
        working-directory: tools/asset-studio
        run: npm ci
      - name: Install Chromium
        working-directory: tools/asset-studio
        run: npx playwright install --with-deps chromium
      - name: Render island and fortress raster assets
        working-directory: tools/asset-studio
        env:
          CHROMIUM_PATH: /home/runner/.cache/ms-playwright/chromium-*/chrome-linux/chrome
        run: |
          CHROME=$(find /home/runner/.cache/ms-playwright -type f -name chrome -o -name chromium | head -n 1)
          CHROMIUM_PATH="$CHROME" node render.mjs islands-verdant islands-misty islands-coral islands-haven islands-crimson islands-storm islands-ice islands-toxic islands-lava islands-abyss fleet-base-verdant fleet-base-misty fleet-base-coral fleet-base-haven fleet-base-crimson fleet-base-storm fleet-base-ice fleet-base-toxic fleet-base-lava fleet-base-abyss
      - name: Commit generated WebP assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/islands-*.webp public/assets/fleet-base-*.webp
          git diff --cached --quiet && exit 0
          git commit -m "Render professional 3D island and fleet raster assets"
          git push
